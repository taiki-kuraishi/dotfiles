name: update-skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # 毎日 00:00 UTC（= 09:00 JST）

concurrency:
  group: update-skills
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - name: Update global agent skills
        env:
          HOME: ${{ github.workspace }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npx --yes skills@latest update -g -y
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: .agents/.skill-lock.json
          branch: chore/update-skills
          delete-branch: true
          commit-message: "⬆️ skills: update global agent skills"
          title: "⬆️ skills: update global agent skills"
          reviewers: taiki-kuraishi
          body: |
            Automated update by `npx skills update -g`.

            Only `.agents/.skill-lock.json` is updated here. The skill contents
            (`.agents/skills/`) are untracked, so run `npx skills update -g` locally
            after merging to sync them.
