name: update-skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC（bootstrap.yml と同じ枠）

concurrency:
  group: update-skills
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - name: Update global agent skills
        env:
          HOME: ${{ github.workspace }}
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npx --yes skills@latest update -g -y
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: .agents/.skill-lock.json
          branch: chore/update-skills
          delete-branch: true
          commit-message: "⬆️ skills: update global agent skills"
          title: "⬆️ skills: update global agent skills"
          body: |
            `npx skills update -g` による自動更新です。

            更新対象は `.agents/.skill-lock.json` のみです。skill 本体（`.agents/skills/`）は
            untracked なので、マージ後に手元で `npx skills update -g` を実行して同期してください。
