name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes

      - name: nixfmt --check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')

      - name: dprint check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          nix run nixpkgs#dprint -- check \
            --config .config/dprint/dprint.json \
            $(git ls-files '*.json' '*.yml' '*.yaml')

  statusline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run statusline display tests
        run: bats .claude/statusline-command.bats

  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .config/nix
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes

      - name: nix flake check
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix flake check

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .config/nix
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: darwin
            name: macbook-air
          - kind: darwin
            name: RN2162
          - kind: darwin
            name: ci-runner
          - kind: home
            name: user-x86_64-linux
          - kind: home
            name: user-aarch64-linux
          - kind: home
            name: runner-x86_64-linux
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Evaluate darwinConfigurations.${{ matrix.name }}
        if: matrix.kind == 'darwin'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix eval ".#darwinConfigurations.${{ matrix.name }}.config.system.build.toplevel.drvPath"

      - name: Evaluate homeConfigurations.${{ matrix.name }}
        if: matrix.kind == 'home'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: nix eval ".#homeConfigurations.\"${{ matrix.name }}\".activationPackage.drvPath"
