[tools]
bun = "latest"
node = "latest"
pnpm = "latest"
uv = "latest"
go = "latest"
java = "latest"
deno = "latest"
bats = "latest"

# pi-shazam
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:yaml-language-server" = "latest"

"cargo:shpool" = "latest"
rust = "latest"

# git worktree manager
"cargo:worktrunk" = "latest"

[settings]
npm.bun = true
idiomatic_version_file_enable_tools = ["python"]
lockfile = true

[env]
# openssl-sys (needed to build worker-build for the roppoh sim-server crate)
# looks for openssl.pc via pkg-config, and the resulting binary dynamically
# links libssl.so.3 at runtime. openssl only exists as a nix profile package
# here (no system libssl-dev/pkg-config), and its files live outside the
# default pkg-config/ld.so search paths.
PKG_CONFIG_PATH = "{{env.HOME}}/.nix-profile/lib/pkgconfig"
LD_LIBRARY_PATH = "{{env.HOME}}/.nix-profile/lib"
