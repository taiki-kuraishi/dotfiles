onboarding = false
[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"
[terminal]
shell_mode = "login"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
kitty_graphics = true

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = false, bold = true }],
  ["agent"],
]
