onboarding = false
[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

[terminal]
# roppoh の dev-pod(Linux)で load-bearing。既定の "auto" は macOS だけログインシェルに
# なり、Linux では非ログインシェルになる。dev-pod は /etc/zsh/zprofile でしか
# ~/.nix-profile/bin を PATH に足していないため、非ログインだとペイン内で mise / docker /
# kubectl / sops がどれも解決しない。macOS では "auto" と等価なので無挙動。
shell_mode = "login"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
