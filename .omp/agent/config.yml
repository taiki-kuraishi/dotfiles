modelRoles:
  smol: opencode-go/deepseek-v4.1-flash:low
  task: opencode-go/deepseek-v4.1-flash:max
  default: anthropic/claude-opus-5-5:high
  vision: opencode-go/deepseek-v4-flash-vision-exp:auto
  slow: anthropic/claude-opus-5-5:high
  tiny: opencode-go/deepseek-v4.1-flash:low
  memory: opencode-go/deepseek-v4.1-flash:low
  advisor: anthropic/claude-opus-5-5:high
  commit: opencode-go/deepseek-v4.1-flash:low
symbolPreset: nerd
composer:
  shape: pi
  tokenRate: true
theme:
  dark: titanium
  light: light
setupVersion: 2
colorBlindMode: false
statusLine:
  preset: custom
  separator: powerline
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - context_pct
  transparent: true
  compactThinkingLevel: true
terminal:
  showProgress: true
tui:
  textSizing: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  hideToolActivity: false
defaultThinkingLevel: max
task:
  disabledAgents:
    - security-reviewer
  agentModelOverrides:
    reviewer: opencode-go/deepseek-v4.1-flash
    scout: opencode-go/deepseek-v4.1-flash
    sonic: opencode-go/deepseek-v4.1-flash
    task: opencode-go/deepseek-v4.1-flash
hideThinkingBlock: true
dev:
  autoqaConsent: denied
commands:
  enableClaudeUser: true
